<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Chiikawa Collection Child</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --tab-color: #d77485; --accent-soft: #fdf0f2; --warm: #f9f0e8; --border: #ede0d8; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: transparent;
      margin: 0; padding: 0 0 60px;
      color: #3d2f2f;
      overflow-x: hidden;
    }

    /* Loading */
    .loading-container {
      margin-top: 60px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: #a07070; font-size: 13px;
    }
    .loading-icon {
      width: 50px; height: 50px; object-fit: contain;
      animation: bounce 0.7s ease-in-out infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

    /* Card Container */
    #card-container {
      max-width: 1200px; margin: 0 auto; padding: 10px;
    }

    .category-section {
      margin-top: 24px; text-align: left;
      scroll-margin-top: 180px;
    }
    .category-title {
      font-size: 14px; font-weight: 700;
      margin-bottom: 12px; padding: 6px 12px;
      border-left: 4px solid var(--tab-color);
      color: #3d2f2f; background: rgba(255,255,255,0.7);
      border-radius: 0 8px 8px 0;
    }

    /* Grid */
    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px; justify-items: center;
    }

    /* Card */
    .card {
      width: 100%; max-width: 120px;
      border-radius: 16px;
      background: #fff;
      border: 2px solid var(--border);
      position: relative; text-align: center; padding-bottom: 8px;
      box-shadow: 0 2px 8px rgba(180,100,110,0.07);
      cursor: pointer; overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    }
    .card:active { transform: scale(0.96); }
    .card.owned {
      border-color: var(--tab-color);
      background: var(--accent-soft, #fdf0f2);
      box-shadow: 0 4px 14px rgba(215,116,133,0.18);
    }
    .card img {
      width: 100%; aspect-ratio: 1; object-fit: contain;
      padding: 8px; box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .card.not-owned img { opacity: 0.45; filter: grayscale(30%); }

    .card .name {
      margin: 2px 6px 4px;
      font-size: 11px; font-weight: 600; line-height: 1.4;
      min-height: 28px; display: flex; align-items: center; justify-content: center;
      color: #3d2f2f;
    }

    /* Owned toggle button */
    .owned-btn {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid var(--tab-color);
      background: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; transition: background 0.2s, transform 0.15s;
      z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .owned-btn:active { transform: scale(0.88); }
    .card.owned .owned-btn { background: var(--tab-color); }

    /* Not owned label */
    .not-owned-label {
      font-size: 10px; color: #bbb; font-weight: 500;
      margin-bottom: 2px; display: block;
    }
    .card.owned .not-owned-label { display: none; }
    .owned-label {
      font-size: 10px; color: var(--tab-color); font-weight: 700;
      margin-bottom: 2px; display: none;
    }
    .card.owned .owned-label { display: block; }

    /* Search highlight */
    .card.search-hide { display: none; }
    .card.search-match { border-color: var(--tab-color); }

    /* Empty state */
    .empty-note {
      text-align: center; padding: 40px 20px;
      color: #b09090; font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="loading-msg" class="loading-container">
    <img id="loading-img" src="" alt="Loading" class="loading-icon" />
    <div>讀取中…</div>
  </div>

  <div id="card-container"></div>

<script>
const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15cmhhdHpkeXBpd3dnbW1mYnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1MTM4NzUsImV4cCI6MjA4MTA4OTg3NX0.s6w2f3pKovuFYkR09bLvPBVJUa6b3Uw2gIXrlw9teb8'; 
const SHEET_ID = "1iCEqgnGGa_TVVbx90xNWxDzwKtz94VfqF8IsXRvpKMY";
const SHEET_NAME = "ちいかわ";

let sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ROLE_CONFIGS = {
  "chii":   { name:"吉伊", sheetKey:"吉", sbPrefix:"吉伊", configKey:"visible_categories_chii",   color:"#d77485", loadImg:"https://i.postimg.cc/ncqjRJ9S/icon001.png" },
  "hachi":  { name:"小八", sheetKey:"八", sbPrefix:"小八", configKey:"visible_categories_hachi",  color:"#6293b8", loadImg:"https://i.postimg.cc/Ss5kqJ3L/icon002.png" },
  "usagi":  { name:"兔兔", sheetKey:"兔", sbPrefix:"兔兔", configKey:"visible_categories",        color:"#f9be3c", loadImg:"https://i.postimg.cc/QdbBDJbp/icon003.png" },
  "momo":   { name:"小桃", sheetKey:"桃", sbPrefix:"小桃", configKey:"visible_categories_others", color:"#838BC2", loadImg:"https://i.postimg.cc/rwcd7PSV/icon016.png" },
  "master": { name:"師傅", sheetKey:"獺", sbPrefix:"師傅", configKey:"visible_categories_others", color:"#CCAFA5", loadImg:"https://i.postimg.cc/y8vNtY1j/icon005.png" },
  "kuri":   { name:"栗子", sheetKey:"栗", sbPrefix:"栗子", configKey:"visible_categories_kuri",   color:"#94C973", loadImg:"https://i.postimg.cc/mD0kjXLG/icon006.png" },
  "shisa":  { name:"風獅", sheetKey:"獅", sbPrefix:"風獅", configKey:"visible_categories_shisa",  color:"#FBAA60", loadImg:"https://i.postimg.cc/Ghn9s5gF/icon007.png" },
  "furu":   { name:"古本", sheetKey:"古", sbPrefix:"古本", configKey:"visible_categories_others", color:"#eb9e97", loadImg:"https://i.postimg.cc/2jsL76yB/icon008.png" },
  "others": { name:"其他", sheetKey:"其", sbPrefix:"其他", configKey:"visible_categories_others", color:"#45818e", loadImg:"https://i.postimg.cc/PqVPpf0J/icon009.png" }
};

let currentRole = "chii";
let currentConfig = ROLE_CONFIGS["chii"];
let globalItems = [];
let allCategories = [];
let visibleCategories = ["吊娃", "娃"];
let ownedItems = new Set();
let supabaseOverrides = {};

function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const roleParam = urlParams.get('role');
  if (roleParam && ROLE_CONFIGS[roleParam]) {
    currentRole = roleParam;
    currentConfig = ROLE_CONFIGS[roleParam];
  }
  document.documentElement.style.setProperty('--tab-color', currentConfig.color);
  document.documentElement.style.setProperty('--accent-soft', currentConfig.color + '22');
  document.getElementById("loading-img").src = currentConfig.loadImg;
  loadData();
  window.parent.postMessage({ type: 'childReady' }, '*');
}

window.addEventListener('message', function(e) {
  if (!e.data) return;

  if (e.data.type === 'scrollTo') {
    const el = document.getElementById(`cat-${e.data.category}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if (e.data.type === 'ownedSet') {
    ownedItems = new Set(e.data.owned || []);
    renderCards(); // re-render with updated owned state
  }
  if (e.data.type === 'search') {
    doSearch(e.data.query || '');
  }
});

async function loadData() {
  try {
    supabaseOverrides = {};

    if (sbClient) {
      const { data: config } = await sbClient.from('chiikawa_config')
        .select('config_value')
        .eq('config_key', currentConfig.configKey)
        .single();
      if (config && config.config_value) {
        visibleCategories = Array.isArray(config.config_value)
          ? config.config_value
          : JSON.parse(config.config_value);
      }

      const { data: items } = await sbClient.from('chiikawa_data').select('*');
      items?.forEach(row => { supabaseOverrides[row.item_name] = row; });
    }

    const sheetRes = await fetch(
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`
    ).then(r => r.text());
    const json = JSON.parse(sheetRes.substr(47).slice(0,-2));
    const rows = json.table.rows || [];

    const tempCats = new Set();
    globalItems = rows.map(row => {
      const roleField = row.c[0]?.v || "";
      const type = row.c[1]?.v || "其他";
      const itemName = row.c[3]?.v || "";
      if (!itemName || !roleField.includes(currentConfig.sheetKey)) return null;

      const fullKey = currentConfig.sbPrefix + itemName;
      const shortKey = itemName;
      let sbData = null, finalKey = fullKey;

      if (supabaseOverrides[fullKey]) { finalKey = fullKey; sbData = supabaseOverrides[fullKey]; }
      else if (supabaseOverrides[shortKey]) { finalKey = shortKey; sbData = supabaseOverrides[shortKey]; }

      tempCats.add(type);
      return {
        dbKey: finalKey,
        name: itemName,
        type: type,
        img: row.c[12]?.v || "https://i.postimg.cc/bv5xRs04/image.png",
        status: sbData?.status || "現貨",
      };
    }).filter(i => i !== null);

    allCategories = Array.from(tempCats);

    document.getElementById("loading-msg").style.display = 'none';
    renderCards();
    sendCategoriesToParent();

    // Report total to parent
    window.parent.postMessage({ type: 'totalCount', count: globalItems.length }, '*');

  } catch (e) {
    console.error(e);
    const loadingDiv = document.querySelector("#loading-msg div");
    if (loadingDiv) loadingDiv.innerText = "載入失敗，請稍後重試";
  }
}

function renderCards() {
  const container = document.getElementById("card-container");
  container.innerHTML = "";

  const catsToDisplay = allCategories.filter(c => visibleCategories.includes(c));
  if (!sendCategoriesToParent._sent) sendCategoriesToParent(catsToDisplay);

  catsToDisplay.forEach(cat => {
    const items = globalItems.filter(i =>
      i.type === cat && !i.status.includes("不顯示")
    );
    if (items.length === 0) return;

    const section = document.createElement("div");
    section.id = `cat-${cat}`;
    section.className = "category-section";
    section.innerHTML = `<div class="category-title">${cat}</div>`;

    const grid = document.createElement("div");
    grid.className = "group-grid";

    items.forEach(item => {
      const isOwned = ownedItems.has(item.dbKey);
      const card = document.createElement("div");
      card.className = `card ${isOwned ? 'owned' : 'not-owned'}`;
      card.dataset.key = item.dbKey;
      card.dataset.name = item.name;
      card.innerHTML = `
        <button class="owned-btn" onclick="event.stopPropagation(); toggleOwned('${item.dbKey}', '${escHtml(item.img)}', '${escHtml(item.name)}')">
          ${isOwned ? '♥' : '♡'}
        </button>
        <img src="${item.img}" loading="lazy" alt="${escHtml(item.name)}">
        <div class="name">${item.name}</div>
        <span class="owned-label">✓ 已擁有</span>
        <span class="not-owned-label">未擁有</span>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  setTimeout(sendHeight, 100);
}

function toggleOwned(dbKey, img, name) {
  window.parent.postMessage({
    type: 'toggleOwned',
    dbKey: dbKey,
    img: img,
    name: name,
    roleKey: currentRole
  }, '*');
}

function doSearch(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    if (!q) {
      card.classList.remove('search-hide', 'search-match');
    } else if (card.dataset.name.toLowerCase().includes(q)) {
      card.classList.remove('search-hide');
      card.classList.add('search-match');
    } else {
      card.classList.add('search-hide');
      card.classList.remove('search-match');
    }
  });
}

function escHtml(s) {
  return String(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}

function sendCategoriesToParent(list = null) {
  const data = list || allCategories.filter(c => visibleCategories.includes(c));
  window.parent.postMessage({ type: 'categories', data: data }, '*');
}

function sendHeight() {
  window.parent.postMessage({ height: document.body.scrollHeight + 20 }, '*');
}

window.addEventListener('resize', sendHeight);
window.addEventListener('load', sendHeight);

init();
</script>
</body>
</html>
