<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5c0c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Chiikawa 掛件收藏</title>
  <meta name="description" content="Chiikawa 吉伊卡哇 個人掛件收藏 × 每日抽選 App">
  <meta property="og:title" content="Chiikawa 掛件收藏">
  <meta property="og:image" content="https://8ytxybb7cg-web.github.io/Chiikawa_Guide/IMG_7282.png">
  <link rel="icon" href="./IMG_7282.png" type="image/png" />
  <link rel="apple-touch-icon" href="./IMG_7282.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --accent: #d77485;
      --accent-light: #f5c0c8;
      --accent-soft: #fdf0f2;
      --cream: #fdf8f2;
      --warm: #f9f0e8;
      --text: #3d2f2f;
      --text-soft: #8a7070;
      --border: #ede0d8;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(180,100,110,0.10);
      --tab-color: #d77485;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    /* ===== TOP HEADER ===== */
    .top-header {
      position: fixed;
      top: 0; left: 0; width: 100%; z-index: 5000;
      background: var(--white);
      border-bottom: 1.5px solid var(--border);
      height: 50px;
      display: flex;
      align-items: center; justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 12px rgba(215,116,133,0.08);
      transition: background 0.3s;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-icon { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .header-title { font-weight: 700; font-size: 14px; color: var(--accent); letter-spacing: 0.5px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .header-btn {
      padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--accent-light);
      font-size: 12px; cursor: pointer; color: var(--accent); background: var(--accent-soft);
      font-weight: 600;
    }
    .header-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ===== MAIN SCROLL ===== */
    .main-scroll { padding-top: 50px; }

    /* ===== BOTTOM TABS ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 4000;
      background: var(--white);
      border-top: 1.5px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      height: calc(56px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 12px rgba(180,100,110,0.08);
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; padding: 6px 0;
      color: var(--text-soft); transition: color 0.2s;
    }
    .nav-tab.active { color: var(--accent); }
    .nav-tab svg { width: 22px; height: 22px; }
    .nav-tab span { font-size: 10px; font-weight: 600; }

    /* ===== PAGE SECTIONS ===== */
    .page { display: none; min-height: calc(100vh - 106px); padding-bottom: 20px; }
    .page.active { display: block; }

    /* ===== HOME PAGE ===== */
    .home-hero {
      background: linear-gradient(135deg, #fff5f7 0%, #fff9f0 100%);
      padding: 24px 20px 20px;
      text-align: center;
      border-bottom: 1.5px solid var(--border);
    }
    .home-date {
      font-size: 12px; color: var(--text-soft); margin-bottom: 4px; letter-spacing: 1px;
    }
    .home-greeting {
      font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px;
    }
    .home-subtitle { font-size: 13px; color: var(--text-soft); }

    .draw-section {
      margin: 20px 16px;
      background: var(--white);
      border-radius: 20px;
      border: 2px dashed var(--accent-light);
      padding: 24px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .draw-section-title { font-size: 13px; color: var(--text-soft); margin-bottom: 6px; letter-spacing: 1px; }
    .draw-result-area {
      min-height: 200px; /* increased for 2x image */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 12px 0;
    }
    .draw-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .draw-placeholder-icon { font-size: 40px; }
    .draw-placeholder-text { font-size: 13px; color: var(--text-soft); }

    .draw-result-card {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    /* 2x size: was 90px → 180px */
    .draw-result-img {
      width: 180px; height: 180px; object-fit: contain;
      border-radius: 24px; background: var(--warm);
      border: 2px solid var(--accent-light);
    }
    .draw-result-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .draw-result-role { font-size: 13px; color: var(--text-soft); }

    @keyframes popIn {
      0% { transform: scale(0.5) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .btn-draw {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #e8849a, #d77485);
      color: #fff; border: none; border-radius: 50px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(215,116,133,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }
    .btn-draw:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(215,116,133,0.25); }
    .btn-draw:disabled { opacity: 0.6; cursor: not-allowed; }

    .draw-confirm-btns { display: flex; gap: 10px; margin-top: 12px; }
    .btn-confirm { flex: 1; padding: 12px; border-radius: 50px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-confirm.yes { background: var(--accent); color: #fff; }
    .btn-confirm.no { background: var(--warm); color: var(--text-soft); border: 1.5px solid var(--border); }

    /* ===== ROLE FILTER: 5 per row circle icons ===== */
    .role-filter-section {
      margin: 0 16px 16px;
      background: var(--white); border-radius: 16px; padding: 14px 16px;
      border: 1px solid var(--border);
    }
    .section-label { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; letter-spacing: 1px; font-weight: 600; }
    .role-chips {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      justify-items: center;
    }
    .role-chip {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
      border: 2.5px solid var(--border); background: var(--white);
      transition: all 0.2s; overflow: hidden;
    }
    .role-chip.active {
      border-color: var(--tab-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--tab-color) 25%, transparent);
    }
    .role-chip img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; opacity: 0.45; filter: grayscale(40%); }
    .role-chip.active img { opacity: 1; filter: none; }

    /* Recent History */
    .section-card {
      margin: 0 16px 16px;
      background: var(--white); border-radius: 16px; padding: 14px 16px;
      border: 1px solid var(--border);
    }
    .section-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .recent-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .recent-list::-webkit-scrollbar { display: none; }
    .recent-item { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .recent-item img { width: 56px; height: 56px; object-fit: contain; border-radius: 12px; background: var(--warm); border: 1.5px solid var(--border); }
    .recent-item-date { font-size: 10px; color: var(--text-soft); }
    .recent-empty { font-size: 13px; color: var(--text-soft); text-align: center; padding: 10px 0; }

    /* ===== COLLECTION (图鑑) PAGE ===== */
    .collection-header {
      padding: 16px 16px 8px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 50px; z-index: 100;
    }
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--warm); border-radius: 12px; padding: 8px 12px;
      border: 1.5px solid var(--border);
    }
    .search-bar input {
      flex: 1; border: none; background: none; outline: none;
      font-size: 14px; color: var(--text);
    }
    .search-bar input::placeholder { color: var(--text-soft); }

    .collection-tabs {
      display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; scrollbar-width: none;
    }
    .collection-tabs::-webkit-scrollbar { display: none; }
    .coll-tab {
      flex-shrink: 0; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--border); color: var(--text-soft); background: var(--white);
      transition: all 0.2s;
    }
    .coll-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .collection-iframe-wrap { width: 100%; }
    #content-frame {
      width: 100%; border: none; display: block;
      min-height: 600px; transition: opacity 0.2s;
    }

    /* ===== CALENDAR PAGE ===== */
    .calendar-wrap { padding: 16px; }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-month-title { font-size: 16px; font-weight: 700; }
    .cal-nav-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--white); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
      color: var(--text-soft);
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-label { text-align: center; font-size: 11px; color: var(--text-soft); font-weight: 600; padding: 4px 0; }
    .cal-cell {
      aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border);
      background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.2s;
      padding: 2px;
    }
    .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-cell.today { border-color: var(--accent); background: var(--accent-soft); }
    .cal-cell.has-entry { border-color: var(--accent-light); }
    .cal-cell .cal-date { font-size: 10px; color: var(--text-soft); font-weight: 600; align-self: flex-start; margin-left: 4px; }
    .cal-cell img { width: 70%; height: 70%; object-fit: contain; border-radius: 6px; }

    /* Calendar detail modal – with delete button */
    .cal-detail-modal {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9000;
      background: var(--white); border-radius: 24px 24px 0 0;
      padding: 20px 24px calc(20px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 40px rgba(0,0,0,0.15);
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .cal-detail-modal.open { transform: translateY(0); }
    .cal-modal-drag { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .cal-modal-content { display: flex; gap: 16px; align-items: center; }
    .cal-modal-img { width: 80px; height: 80px; object-fit: contain; border-radius: 14px; background: var(--warm); border: 1.5px solid var(--border); }
    .cal-modal-info { flex: 1; }
    .cal-modal-info h3 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
    .cal-modal-info p { font-size: 13px; color: var(--text-soft); margin: 0 0 2px; }
    .cal-modal-info .cal-modal-role { color: var(--accent); font-weight: 600; }
    .btn-delete-entry {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; margin-top: 16px; padding: 12px;
      border-radius: 50px; border: 1.5px solid #e0a0a0;
      background: #fff5f5; color: #c05050;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-delete-entry:active { background: #ffe0e0; transform: scale(0.97); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 8999; display: none; }
    .modal-overlay.open { display: block; }

    /* ===== DRAW ANIMATION OVERLAY ===== */
    .draw-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #fff5f7 0%, #fff9f0 50%, #f0f5ff 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .draw-overlay.active { display: flex; }

    .draw-anim-stage {
      position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center;
    }
    .draw-spin-ring {
      position: absolute; width: 260px; height: 260px; border-radius: 50%;
      border: 3px dashed var(--accent-light);
      animation: spinRing 2s linear infinite;
    }
    @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .draw-floating-stars {
      position: absolute; inset: 0; pointer-events: none;
    }
    .star {
      position: absolute; font-size: 18px;
      animation: floatStar 1.5s ease-in-out infinite alternate;
    }
    @keyframes floatStar {
      from { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      to { transform: translateY(-12px) rotate(15deg); opacity: 1; }
    }

    /* 2x size in animation overlay: was 100px → 200px */
    .draw-bounce-img {
      width: 200px; height: 200px; object-fit: contain; border-radius: 30px;
      animation: bounceDraw 0.6s ease-in-out infinite alternate;
      background: var(--warm); border: 2px solid var(--accent-light); padding: 12px;
    }
    @keyframes bounceDraw {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-12px) scale(1.05); }
    }

    .draw-anim-text { font-size: 14px; color: var(--text-soft); margin-top: 24px; animation: fadeText 1s ease-in-out infinite alternate; }
    @keyframes fadeText { from { opacity: 0.5; } to { opacity: 1; } }

    /* Sub-nav for collection */
    .sticky-sub-nav {
      position: sticky;
      top: calc(50px + 90px);
      z-index: 99;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      display: none;
      white-space: nowrap; overflow-x: auto; scrollbar-width: none;
    }
    .sticky-sub-nav::-webkit-scrollbar { display: none; }
    .sub-nav-content { display: inline-flex; padding: 0 16px; gap: 8px; }
    .sub-nav-item {
      font-size: 12px; color: var(--text-soft);
      padding: 4px 12px; border-radius: 12px; background: var(--warm); cursor: pointer;
      transition: all 0.2s; border: 1px solid var(--border);
    }
    .sub-nav-item:active, .sub-nav-item:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Decorative dots */
    .deco-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-light); margin-right: 6px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex; justify-content: space-around;
      margin: 0 16px 16px;
      background: var(--white); border-radius: 16px; padding: 14px;
      border: 1px solid var(--border);
    }
    .stat-item { text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-soft); }
    .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* Loading */
    .loading-bar {
      display: flex; flex-direction: column; align-items: center; padding: 30px;
      gap: 10px; color: var(--text-soft); font-size: 13px;
    }
    .loading-bar img { width: 50px; animation: bounce 0.8s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

    /* Toast */
    .toast {
      position: fixed; bottom: calc(70px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: #fff; padding: 10px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 600; z-index: 99999;
      opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="top-header">
    <div class="header-left">
      <img class="header-icon" src="https://i.postimg.cc/ncqjRJ9S/icon001.png" id="header-role-icon" alt="">
      <div class="header-title">ちいかわ 掛件手帳</div>
    </div>
    <div class="header-right" id="header-right">
      <!-- dynamic -->
    </div>
  </div>

  <div class="main-scroll">
    <!-- ===== PAGE: HOME ===== -->
    <div class="page active" id="page-home">
      
      <div class="home-hero">
        <div class="home-date" id="home-date"></div>
        <div class="home-greeting">今日掛邊隻出街？ 🎒</div>
        <div class="home-subtitle">從你的收藏中隨機抽選今日掛件</div>
      </div>

      <!-- Stats -->
      <div style="height:16px;"></div>
      <div class="stats-bar" id="stats-bar">
        <div class="stat-item"><div class="stat-num" id="stat-owned">0</div><div class="stat-label">已擁有</div></div>
        <div class="stat-item"><div class="stat-num" id="stat-total">0</div><div class="stat-label">圖鑑總數</div></div>
        <div class="stat-item"><div class="stat-num" id="stat-streak">0</div><div class="stat-label">連續天數</div></div>
      </div>

      <!-- Role Filter -->
      <div class="role-filter-section">
        <div class="section-label">✦ 角色篩選（多選）</div>
        <div class="role-chips" id="role-chips"></div>
      </div>

      <!-- Draw Section -->
      <div class="draw-section">
        <div class="draw-section-title">✦ 今日掛件抽選 ✦</div>
        <div class="draw-result-area" id="draw-result-area">
          <div class="draw-placeholder">
            <div class="draw-placeholder-icon">🎀</div>
            <div class="draw-placeholder-text">按下按鈕，抽出今日掛件</div>
          </div>
        </div>
        <div id="draw-confirm-btns" class="draw-confirm-btns" style="display:none;">
          <button class="btn-confirm no" onclick="redraw()">再抽一次</button>
          <button class="btn-confirm yes" onclick="confirmDraw()">✓ 就決定是你了！</button>
        </div>
        <button class="btn-draw" id="btn-draw" onclick="startDraw()">今日掛邊隻？🎲</button>
      </div>

      <!-- Recent History -->
      <div class="section-card">
        <div class="section-card-title"><span class="deco-dot"></span>最近掛件紀錄</div>
        <div class="recent-list" id="recent-list">
          <div class="recent-empty">還未有紀錄，快去抽選吧！</div>
        </div>
      </div>

    </div>

    <!-- ===== PAGE: COLLECTION ===== -->
    <div class="page" id="page-collection">
      <div class="collection-header">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a07070" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="搜尋公仔名稱…" oninput="onSearch(this.value)">
        </div>
        <div class="collection-tabs" id="collection-tabs">
          <div class="coll-tab active" onclick="switchRole('chii',this)">吉伊</div>
          <div class="coll-tab" onclick="switchRole('hachi',this)">小八</div>
          <div class="coll-tab" onclick="switchRole('usagi',this)">兔兔</div>
          <div class="coll-tab" onclick="switchRole('momo',this)">小桃</div>
          <div class="coll-tab" onclick="switchRole('furu',this)">古本</div>
          <div class="coll-tab" onclick="switchRole('master',this)">師傅</div>
          <div class="coll-tab" onclick="switchRole('kuri',this)">栗子</div>
          <div class="coll-tab" onclick="switchRole('shisa',this)">風獅</div>
          <div class="coll-tab" onclick="switchRole('jokebear',this)">大舅</div>
          <div class="coll-tab" onclick="switchRole('korokke',this)">可樂餅</div>
          <div class="coll-tab" onclick="switchRole('others',this)">其他</div>
        </div>
      </div>

      <div id="sub-nav-container" class="sticky-sub-nav">
        <div id="sub-nav-content" class="sub-nav-content"></div>
      </div>

      <div class="collection-iframe-wrap">
        <iframe id="content-frame" src="" scrolling="no"></iframe>
      </div>
    </div>

    <!-- ===== PAGE: CALENDAR ===== -->
    <div class="page" id="page-calendar">
      <div class="calendar-wrap">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
          <div class="cal-month-title" id="cal-month-title"></div>
          <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

  </div><!-- end main-scroll -->

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-tab active" id="nav-home" onclick="showPage('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首頁</span>
    </div>
    <div class="nav-tab" id="nav-collection" onclick="showPage('collection')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>收藏圖鑑</span>
    </div>
    <div class="nav-tab" id="nav-calendar" onclick="showPage('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>掛件月曆</span>
    </div>
  </div>

  <!-- DRAW ANIMATION OVERLAY -->
  <div class="draw-overlay" id="draw-overlay">
    <div class="draw-anim-stage">
      <div class="draw-spin-ring"></div>
      <div class="draw-floating-stars" id="draw-stars"></div>
      <img class="draw-bounce-img" id="draw-anim-img" src="https://i.postimg.cc/ncqjRJ9S/icon001.png" alt="">
    </div>
    <div class="draw-anim-text" id="draw-anim-text">🌸 抽選中… 🌸</div>
  </div>

  <!-- CALENDAR DETAIL MODAL -->
  <div class="modal-overlay" id="cal-modal-overlay" onclick="closeCalModal()"></div>
  <div class="cal-detail-modal" id="cal-detail-modal">
    <div class="cal-modal-drag"></div>
    <div class="cal-modal-content">
      <img class="cal-modal-img" id="cal-modal-img" src="" alt="">
      <div class="cal-modal-info">
        <h3 id="cal-modal-name"></h3>
        <p id="cal-modal-date"></p>
        <p id="cal-modal-role" class="cal-modal-role"></p>
      </div>
    </div>
    <button class="btn-delete-entry" onclick="deleteCalEntry()">🗑 刪除此紀錄</button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bnnah-2fsCaQnKZDoKNJQw_NuYQVvKi';
const SHEET_ID = "1PuaFujPmope_BgFMsJPmUms6I9XW3g1i";
const SHEET_NAME = "ちいかわ";

let sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ROLE_CONFIG = {
  "chii":   { name:"吉伊", sheetKey:"吉", sbPrefix:"吉伊", configKey:"visible_categories_chii",   color:"#d77485", icon:"https://i.postimg.cc/vZDs4YNZ/icon.png" },
  "hachi":  { name:"小八", sheetKey:"八", sbPrefix:"小八", configKey:"visible_categories_hachi",  color:"#6293b8", icon:"https://i.postimg.cc/sDTzfQKL/icon.png" },
  "usagi":  { name:"兔兔", sheetKey:"兔", sbPrefix:"兔兔", configKey:"visible_categories",        color:"#f9be3c", icon:"https://i.postimg.cc/xdzVPsYr/icon.png" },
  "momo":   { name:"小桃", sheetKey:"桃", sbPrefix:"小桃", configKey:"visible_categories_others", color:"#838BC2", icon:"https://i.postimg.cc/9MP36rrJ/icon.png" },
  "furu":    { name:"古本", sheetKey:"古", sbPrefix:"古本", configKey:"visible_categories_others", color:"#eb9e97", icon:"https://i.postimg.cc/nh5t7yyY/icon.png" },
  "master": { name:"師傅", sheetKey:"師", sbPrefix:"師傅", configKey:"visible_categories_others", color:"#CCAFA5", icon:"https://i.postimg.cc/fTq4Q4Rn/icon.png" },
  "kuri":   { name:"栗子", sheetKey:"栗", sbPrefix:"栗子", configKey:"visible_categories_kuri",   color:"#94C973", icon:"https://i.postimg.cc/FzGMK8bS/icon.png" },
  "shisa":  { name:"風獅", sheetKey:"獅", sbPrefix:"風獅", configKey:"visible_categories_shisa",  color:"#FBAA60", icon:"https://i.postimg.cc/660Jz4sQ/icon.png" },
  "jokebear":  { name:"大舅", sheetKey:"大", sbPrefix:"大舅", configKey:"visible_categories_others", color:"#eca4b1", icon:"https://i.postimg.cc/d3qMwwCv/fen-yeicon-zhong-zheng.png" },
  "korokke": { name:"可樂餅", sheetKey:"可", sbPrefix:"可樂餅", configKey:"visible_categories_others", color:"#FBAA60", icon:"https://i.postimg.cc/HkkZXMWS/icon.png" },
  "others":  { name:"其他", sheetKey:"其", sbPrefix:"其他", configKey:"visible_categories_others", color:"#45818e", icon:"https://i.postimg.cc/63xJbd58/icon.png" }
};

// ===== STATE =====
let activeRole = "chii";
let currentPage = "home";
let allItems = [];
let ownedItems = new Set();
let history = [];
let selectedRoles = new Set(Object.keys(ROLE_CONFIG));
let currentDrawResult = null;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let currentCalDate = null; // track which date is open in modal

const frame = document.getElementById("content-frame");
const subNavContainer = document.getElementById("sub-nav-container");
const subNavContent = document.getElementById("sub-nav-content");

// ===== INIT =====
async function init() {
  renderHomeDate();
  renderRoleChips();
  loadHistory();
  renderRecentList();
  renderCalendar();
  await loadAllItems();
  updateStats();
  switchRole("chii", document.querySelector(".coll-tab.active"));
}

function renderHomeDate() {
  const now = new Date();
  const days = ["日","一","二","三","四","五","六"];
  document.getElementById("home-date").textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 （星期${days[now.getDay()]}）`;
  document.getElementById("cal-month-title").textContent =
    `${calYear} 年 ${calMonth+1} 月`;
}

// ===== LOAD ALL ITEMS FROM SHEET =====
async function loadAllItems() {
  try {
    if (sbClient) {
      const { data } = await sbClient.from('chiikawa_collection').select('item_key');
      if (data) data.forEach(r => ownedItems.add(r.item_key));
    } else {
      const local = JSON.parse(localStorage.getItem('chiikawa_owned') || '[]');
      local.forEach(k => ownedItems.add(k));
    }

    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0,-2));
    const rows = json.table.rows || [];

    allItems = [];
    rows.forEach(row => {
      const roleField = row.c[0]?.v || "";
      const type = row.c[1]?.v || "其他";
      const name = row.c[2]?.v || "";
      const img = row.c[4]?.v || "https://i.postimg.cc/bv5xRs04/image.png";
      if (!name) return;

      for (const [key, cfg] of Object.entries(ROLE_CONFIG)) {
        if (roleField.includes(cfg.sheetKey)) {
          const dbKey = cfg.sbPrefix + name;
          allItems.push({ name, roleKey: key, roleName: cfg.name, img, type, dbKey });
          break;
        }
      }
    });

    updateStats();
    renderRecentList();
    if (frame.contentWindow) {
      frame.contentWindow.postMessage({ type: 'ownedSet', owned: Array.from(ownedItems) }, '*');
    }
  } catch(e) {
    console.error('loadAllItems error:', e);
  }
}

function updateStats() {
  const owned = allItems.filter(i => ownedItems.has(i.dbKey)).length;
  document.getElementById('stat-owned').textContent = owned;
  document.getElementById('stat-total').textContent = allItems.length;
  const today = dateStr(new Date());
  let streak = 0;
  const sorted = [...history].sort((a,b) => b.date.localeCompare(a.date));
  let d = new Date(); d.setHours(0,0,0,0);
  for (let i = 0; i < 365; i++) {
    const s = dateStr(d);
    if (sorted.find(h => h.date === s)) { streak++; d.setDate(d.getDate()-1); }
    else if (s === today) { d.setDate(d.getDate()-1); }
    else break;
  }
  document.getElementById('stat-streak').textContent = streak;
}

// ===== ROLE CHIPS =====
function renderRoleChips() {
  const container = document.getElementById('role-chips');
  container.innerHTML = Object.entries(ROLE_CONFIG).map(([key, cfg]) => `
    <div class="role-chip active" id="chip-${key}" onclick="toggleRoleChip('${key}')" style="--tab-color:${cfg.color}">
      <img src="${cfg.icon}" alt="${cfg.name}">
    </div>
  `).join('');
}

function toggleRoleChip(key) {
  const chip = document.getElementById(`chip-${key}`);
  if (selectedRoles.has(key)) {
    if (selectedRoles.size <= 1) { showToast('至少要選一個角色喔！'); return; }
    selectedRoles.delete(key);
    chip.classList.remove('active');
  } else {
    selectedRoles.add(key);
    chip.classList.add('active');
  }
}

// ===== DRAW SYSTEM =====
function getDrawPool() {
  return allItems.filter(i =>
    ownedItems.has(i.dbKey) &&
    selectedRoles.has(i.roleKey)
  );
}

async function startDraw() {
  const pool = getDrawPool();
  if (pool.length === 0) {
    showToast('抽選池是空的！請先在收藏圖鑑標記已擁有的公仔 🎀');
    return;
  }

  const overlay = document.getElementById('draw-overlay');
  overlay.classList.add('active');
  document.getElementById('btn-draw').disabled = true;

  const picked = pool[Math.floor(Math.random() * pool.length)];
  
  const texts = ['🌸 抽選中… 🌸','🎀 找一找… 🎀','✨ 就快啦… ✨','🍡 決定中… 🍡'];
  let t = 0;
  const animInterval = setInterval(() => {
    const r = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('draw-anim-img').src = r.img;
    document.getElementById('draw-anim-text').textContent = texts[t++ % texts.length];
  }, 200);

  renderDrawStars();

  await sleep(2000);
  clearInterval(animInterval);

  document.getElementById('draw-anim-img').src = picked.img;
  document.getElementById('draw-anim-text').textContent = `✨ ${picked.name} ✨`;

  await sleep(800);
  overlay.classList.remove('active');
  document.getElementById('btn-draw').disabled = false;

  currentDrawResult = picked;
  showDrawResult(picked);
}

function renderDrawStars() {
  const container = document.getElementById('draw-stars');
  const emojis = ['⭐','🌸','✨','🍀','💫','🎀','🌟'];
  container.innerHTML = emojis.map((e, i) => {
    const angle = (i / emojis.length) * 360;
    const r = 120;
    const x = 130 + r * Math.cos(angle * Math.PI/180);
    const y = 130 + r * Math.sin(angle * Math.PI/180);
    return `<div class="star" style="left:${x}px;top:${y}px;animation-delay:${i*0.2}s">${e}</div>`;
  }).join('');
}

function showDrawResult(item) {
  const area = document.getElementById('draw-result-area');
  area.innerHTML = `
    <div class="draw-result-card">
      <img class="draw-result-img" src="${item.img}" alt="${item.name}">
      <div class="draw-result-name">${item.name}</div>
      <div class="draw-result-role">${ROLE_CONFIG[item.roleKey]?.name || ''}</div>
    </div>
  `;
  document.getElementById('draw-confirm-btns').style.display = 'flex';
  document.getElementById('btn-draw').style.display = 'none';
}

function redraw() {
  currentDrawResult = null;
  document.getElementById('draw-result-area').innerHTML = `
    <div class="draw-placeholder">
      <div class="draw-placeholder-icon">🎀</div>
      <div class="draw-placeholder-text">按下按鈕，抽出今日掛件</div>
    </div>`;
  document.getElementById('draw-confirm-btns').style.display = 'none';
  document.getElementById('btn-draw').style.display = 'block';
}

async function confirmDraw() {
  if (!currentDrawResult) return;
  const item = currentDrawResult;
  const today = dateStr(new Date());
  
  history = history.filter(h => h.date !== today);
  history.push({ date: today, name: item.name, img: item.img, roleKey: item.roleKey, dbKey: item.dbKey });
  
  saveHistory();
  
  if (sbClient) {
    try {
      await sbClient.from('chiikawa_history').upsert({
        date: today,
        item_key: item.dbKey,
        item_name: item.name,
        item_img: item.img,
        role_key: item.roleKey,
        updated_at: new Date().toISOString()
      }, { onConflict: 'date' });
    } catch(e) { console.warn('Supabase history save failed', e); }
  }

  showToast(`✓ 今日掛件：${item.name} 已記錄！`);
  redraw();
  renderRecentList();
  updateStats();
  renderCalendar();
}

// ===== HISTORY =====
function loadHistory() {
  history = JSON.parse(localStorage.getItem('chiikawa_history') || '[]');
}

function saveHistory() {
  localStorage.setItem('chiikawa_history', JSON.stringify(history));
}

function renderRecentList() {
  const container = document.getElementById('recent-list');
  const recent = [...history].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 10);
  if (recent.length === 0) {
    container.innerHTML = '<div class="recent-empty">還未有紀錄，快去抽選吧！</div>';
    return;
  }
  container.innerHTML = recent.map(h => {
    const d = new Date(h.date);
    const label = `${d.getMonth()+1}/${d.getDate()}`;
    return `<div class="recent-item">
      <img src="${h.img}" alt="${h.name}">
      <div class="recent-item-date">${label}</div>
    </div>`;
  }).join('');
}

// ===== CALENDAR =====
function renderCalendar() {
  document.getElementById('cal-month-title').textContent = `${calYear} 年 ${calMonth+1} 月`;
  const grid = document.getElementById('cal-grid');
  const dayLabels = ['日','一','二','三','四','五','六'];
  
  let html = dayLabels.map(d => `<div class="cal-day-label">${d}</div>`).join('');
  
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();
  
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';
  
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dateStr(new Date(calYear, calMonth, d));
    const isToday = (calYear === today.getFullYear() && calMonth === today.getMonth() && d === today.getDate());
    const entry = history.find(h => h.date === ds);
    
    if (entry) {
      html += `<div class="cal-cell has-entry${isToday?' today':''}" onclick="openCalModal('${ds}')">
        <div class="cal-date">${d}</div>
        <img src="${entry.img}" alt="${entry.name}">
      </div>`;
    } else {
      html += `<div class="cal-cell${isToday?' today':''}">
        <div class="cal-date">${d}</div>
      </div>`;
    }
  }
  
  grid.innerHTML = html;
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function openCalModal(dateString) {
  const entry = history.find(h => h.date === dateString);
  if (!entry) return;
  currentCalDate = dateString;
  document.getElementById('cal-modal-img').src = entry.img;
  document.getElementById('cal-modal-name').textContent = entry.name;
  const d = new Date(dateString);
  document.getElementById('cal-modal-date').textContent = `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  document.getElementById('cal-modal-role').textContent = ROLE_CONFIG[entry.roleKey]?.name || '';
  document.getElementById('cal-detail-modal').classList.add('open');
  document.getElementById('cal-modal-overlay').classList.add('open');
}

function closeCalModal() {
  document.getElementById('cal-detail-modal').classList.remove('open');
  document.getElementById('cal-modal-overlay').classList.remove('open');
  currentCalDate = null;
}

async function deleteCalEntry() {
  if (!currentCalDate) return;
  const dateToDelete = currentCalDate;

  // Remove from local history
  history = history.filter(h => h.date !== dateToDelete);
  saveHistory();

  // Remove from Supabase
  if (sbClient) {
    try {
      await sbClient.from('chiikawa_history').delete().eq('date', dateToDelete);
    } catch(e) { console.warn('Supabase history delete failed', e); }
  }

  closeCalModal();
  showToast('🗑 紀錄已刪除');
  renderCalendar();
  renderRecentList();
  updateStats();
}

// ===== COLLECTION PAGE =====
function switchRole(key, tabEl) {
  activeRole = key;
  const cfg = ROLE_CONFIG[key];
  
  document.documentElement.style.setProperty('--tab-color', cfg.color);
  document.documentElement.style.setProperty('--accent', cfg.color);
  document.getElementById('header-role-icon').src = cfg.icon;
  
  if (tabEl) {
    document.querySelectorAll('.coll-tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
  }
  
  subNavContainer.style.display = 'none';
  subNavContent.innerHTML = '';
  
  frame.src = `testchild.html?role=${key}&t=${Date.now()}`;
  frame.style.opacity = '0.3';
}

function onSearch(val) {
  if (frame.contentWindow) {
    frame.contentWindow.postMessage({ type: 'search', query: val }, '*');
  }
}

// ===== IFRAME MESSAGES =====
window.addEventListener('message', function(e) {
  if (!e.data) return;
  
  if (e.data.height) {
    frame.style.height = (e.data.height) + 'px';
    frame.style.opacity = '1';
  }
  if (e.data.type === 'categories') {
    renderSubNav(e.data.data);
  }
  if (e.data.type === 'childReady') {
    frame.contentWindow.postMessage({ type: 'ownedSet', owned: Array.from(ownedItems) }, '*');
  }
  if (e.data.type === 'toggleOwned') {
    handleToggleOwned(e.data.dbKey, e.data.img, e.data.name, e.data.roleKey);
  }
  if (e.data.type === 'totalCount') {
    updateStats();
  }
});

function renderSubNav(categories) {
  if (!categories || categories.length === 0) return;
  subNavContent.innerHTML = categories.map(cat =>
    `<div class="sub-nav-item" onclick="tellChildScroll('${cat}')">${cat}</div>`
  ).join('');
  subNavContainer.style.display = 'block';
}

function tellChildScroll(cat) {
  frame.contentWindow.postMessage({ type: 'scrollTo', category: cat }, '*');
}

async function handleToggleOwned(dbKey, img, name, roleKey) {
  const wasOwned = ownedItems.has(dbKey);
  if (wasOwned) {
    ownedItems.delete(dbKey);
  } else {
    ownedItems.add(dbKey);
  }
  
  if (sbClient) {
    try {
      if (!wasOwned) {
        await sbClient.from('chiikawa_collection').upsert({ item_key: dbKey, added_at: new Date().toISOString() }, { onConflict: 'item_key' });
      } else {
        await sbClient.from('chiikawa_collection').delete().eq('item_key', dbKey);
      }
    } catch(e) { console.warn('Supabase collection save failed', e); }
  }
  localStorage.setItem('chiikawa_owned', JSON.stringify(Array.from(ownedItems)));
  
  showToast(wasOwned ? `已從收藏移除` : `✓ 已加入我的收藏！`);
  
  frame.contentWindow.postMessage({ type: 'ownedSet', owned: Array.from(ownedItems) }, '*');
  updateStats();
}

// ===== PAGE SWITCHING =====
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.getElementById(`nav-${page}`).classList.add('active');
  
  if (page === 'collection' && !frame.src) {
    switchRole('chii', document.querySelector('.coll-tab'));
  }
  if (page === 'calendar') renderCalendar();
}

// ===== UTILS =====
function dateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== START =====
init();
</script>
</body>
</html>
